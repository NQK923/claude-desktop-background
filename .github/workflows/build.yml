name: Build

# Main and pull requests are built; pushing a version tag also publishes ClaudeBg.exe as a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build ClaudeBg.exe and run the tests
        shell: powershell
        run: ./tests/run-tests.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeBg
          path: ClaudeBg.exe

      - name: Upload native scene and Studio previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LivingDesk-previews
          path: tests/output/*.png
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(sha256sum ClaudeBg.exe | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" ClaudeBg.exe --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "SHA256 of ClaudeBg.exe: \`$hash\`"
