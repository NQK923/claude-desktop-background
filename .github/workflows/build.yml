name: Build

# Every push and pull request is built; pushing a tag like v1.2.0 also publishes ClaudeBg.exe as a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ClaudeBg.exe
        shell: powershell
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeBg
          path: ClaudeBg.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(sha256sum ClaudeBg.exe | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" ClaudeBg.exe --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "SHA256 of ClaudeBg.exe: \`$hash\`"
